name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: |
          cd host && npm ci
          cd ../products-remote && npm ci
          cd ../basket-remote && npm ci
          
      - name: Run Tests
        run: |
          cd host && npm test
          cd ../products-remote && npm test
          cd ../basket-remote && npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Host
        uses: docker/build-push-action@v4
        with:
          context: ./host
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/host:latest
          
      - name: Build and push Products Remote
        uses: docker/build-push-action@v4
        with:
          context: ./products-remote
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/products-remote:latest
          
      - name: Build and push Basket Remote
        uses: docker/build-push-action@v4
        with:
          context: ./basket-remote
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/basket-remote:latest 